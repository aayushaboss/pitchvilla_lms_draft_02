<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#FFFFFF;border:1px solid #E5E5EA;border-radius:16px;box-shadow:0 4px 12px rgba(28,20,16,0.2);padding:16px;display:flex;flex-direction:column;height:100%;box-sizing:border-box;font-family:Poppins, sans-serif;cursor:pointer;">
  <div style="display:flex;gap:16px;align-items:flex-start;">
    <div style="width:40px;height:40px;border-radius:10px;background:#F5F5F7;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#1C1410;flex-shrink:0;">{{ job.initials }}</div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <span style="font-size:14px;font-weight:600;line-height:1.25;color:#1C1410;min-height:36px;text-wrap:pretty;">{{ job.title }}</span>
      <span style="font-size:12px;font-weight:500;color:#6B5E54;">{{ job.company }}</span>
    </div>
    <ion-icon name="{{ bookmarkIcon }}" style="font-size:20px;color:#A1A1AA;flex-shrink:0;"></ion-icon>
  </div>
  <div style="height:1px;background:#E5E5EA;margin:10px 0;"></div>
  <div style="display:flex;flex-direction:column;gap:3px;">
    <div style="display:flex;align-items:center;gap:6px;"><ion-icon name="location-outline" style="font-size:14px;color:#6B5E54;"></ion-icon><span style="font-size:12px;font-weight:500;color:#6B5E54;">{{ job.location }}</span></div>
    <div style="display:flex;align-items:center;gap:6px;"><ion-icon name="cash-outline" style="font-size:14px;color:#6B5E54;"></ion-icon><span style="font-size:12px;font-weight:500;color:#6B5E54;">{{ job.pay }}</span></div>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:24px;">
    <sc-if value="{{ showMatch }}" hint-placeholder-val="{{ true }}">
      <span style="display:flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;background:rgba(107,94,84,0.14);font-size:12px;font-weight:500;color:#1C1410;">{{ job.match }}<ion-icon name="information-circle-outline" style="font-size:13px;"></ion-icon></span>
    </sc-if>
    <sc-if value="{{ showUrgent }}" hint-placeholder-val="{{ false }}">
      <span style="display:flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:rgba(255,59,48,0.12);font-size:12px;font-weight:500;color:#D92D20;">{{ job.deadline }}</span>
    </sc-if>
    <sc-if value="{{ showDeadline }}" hint-placeholder-val="{{ false }}">
      <span style="display:flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:rgba(107,94,84,0.14);font-size:12px;font-weight:500;color:#6B5E54;">{{ job.deadline }}</span>
    </sc-if>
  </div>
  <div style="margin-top:auto;padding-top:16px;">
    <sc-if value="{{ job.applied }}" hint-placeholder-val="{{ false }}">
      <div style="height:40px;border-radius:999px;border:2px solid #FFCC00;display:flex;align-items:center;justify-content:center;gap:8px;opacity:0.5;font-size:14px;font-weight:600;color:#1C1410;box-sizing:border-box;"><ion-icon name="checkmark-circle" style="font-size:18px;"></ion-icon>Applied</div>
    </sc-if>
    <sc-if value="{{ notApplied }}" hint-placeholder-val="{{ true }}">
      <div style="height:40px;border-radius:999px;border:2px solid #FFCC00;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#1C1410;box-sizing:border-box;" style-hover="background:#FFCC00;">Apply</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:260},&quot;job&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;,&quot;default&quot;:{&quot;title&quot;:&quot;Digital Marketing Intern&quot;,&quot;company&quot;:&quot;PhonePe&quot;,&quot;initials&quot;:&quot;P&quot;,&quot;location&quot;:&quot;Bengaluru&quot;,&quot;pay&quot;:&quot;₹17,000–₹25,000/month&quot;,&quot;match&quot;:&quot;82% match&quot;,&quot;deadline&quot;:&quot;3 days left&quot;,&quot;urgent&quot;:true}}}">
class Component extends DCLogic {
  renderVals() {
    const j = this.props.job ?? {};
    return {
      job: j,
      notApplied: !j.applied,
      showMatch: !j.applied && !!j.match,
      showUrgent: !j.applied && !!j.deadline && !!j.urgent,
      showDeadline: !j.applied && !!j.deadline && !j.urgent,
      bookmarkIcon: j.saved ? 'bookmark' : 'bookmark-outline',
    };
  }
}
</script>
</body>
</html>
